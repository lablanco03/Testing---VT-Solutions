name: CI/CD Pipeline - Calidad de Software

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        working-directory: ./backend
        run: npm install

      - name: Ejecutar Pruebas Unitarias
        working-directory: ./backend
        run: npm run test -- --coverage || echo "No test script"
        continue-on-error: true

      - name: Levantar API Backend
        working-directory: ./backend
        run: |
          npm start &
          npx wait-on tcp:3000 -t 30000
        env:
          PORT: 3000
          MONGODB_URI: mongodb://127.0.0.1:27017/tu_database

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Apache JMeter
        run: |
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

      - name: Correr Test Plan de JMeter
        run: |
          ./apache-jmeter-5.6.3/bin/jmeter -n -t "tests/FlujoCompletodeCompra.jmx" -l tests/results.jtl -e -o tests/jmeter_report

      - name: Análisis Estático SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Subir Evidencia Reporte JMeter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-report
          path: tests/jmeter_report/